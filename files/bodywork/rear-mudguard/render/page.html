<!doctype html><html><body style="margin:0;background:#20242a">
<script src="node_modules/three/build/three.min.js"></script>
<script>
window.renderView = function(D, opt){
  const W=opt.w,H=opt.h;
  const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  r.setSize(W,H); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
  r.toneMapping=THREE.ACESFilmicToneMapping; r.outputColorSpace=THREE.SRGBColorSpace;
  document.body.innerHTML=''; document.body.appendChild(r.domElement);
  const sc=new THREE.Scene(); sc.background=new THREE.Color(0xdfe3e8);
  const cam=new THREE.PerspectiveCamera(opt.fov||30,W/H,10,20000); cam.up.set(0,0,1);
  cam.position.set(...opt.cam); cam.lookAt(...opt.look);
  sc.add(new THREE.HemisphereLight(0xffffff,0x606870,1.4));
  const d=new THREE.DirectionalLight(0xffffff,2.2); d.position.set(-600,-900,1600); d.castShadow=true;
  d.shadow.mapSize.set(4096,4096); Object.assign(d.shadow.camera,{left:-1200,right:1200,top:1200,bottom:-1200,near:10,far:5000}); sc.add(d);
  const d2=new THREE.DirectionalLight(0xffffff,0.8); d2.position.set(800,900,600); sc.add(d2);
  function mesh(p,mat){const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3)); g.computeVertexNormals(); const m=new THREE.Mesh(g,mat); m.castShadow=m.receiveShadow=true; sc.add(m); return m;}
  mesh(D.scan.p,new THREE.MeshStandardMaterial({color:0xb5322a,roughness:.55,metalness:.2,flatShading:false}));
  const gm=[0xf4f4f0,0xf4f4f0,0xf4f4f0];
  D.guard.forEach((g,i)=>mesh(g.p,new THREE.MeshStandardMaterial({color:opt.split?[0xc8102e,0xf4f4f0,0x1f4e9c][i]:gm[i],roughness:.35,metalness:0,side:THREE.DoubleSide})));
  // wheel
  const a=opt.arm*Math.PI/180, ax=[-580*Math.cos(a),0,580*Math.sin(a)];
  const wheel=new THREE.Group(); wheel.position.set(...ax); sc.add(wheel);
  const prof=[]; const R=340,HW=60,c=25;
  prof.push(new THREE.Vector2(235,-52));
  for(let i=0;i<=8;i++){const t=-Math.PI/2+i/8*Math.PI/2; prof.push(new THREE.Vector2(R-c+c*Math.cos(t)-0, -HW+c+c*Math.sin(t)+0));}
  prof.splice(1,0); 
  const pr=[new THREE.Vector2(235,-52)];
  for(let i=0;i<=8;i++){const t=Math.PI+ i/8*Math.PI/2; pr.push(new THREE.Vector2(R-c - c*Math.cos(t-Math.PI)*-1 , 0));}
  // simpler: rounded rectangle profile
  const P=[]; P.push(new THREE.Vector2(232,-50));
  for(let i=0;i<=10;i++){const t=Math.PI*1.5+i/10*Math.PI/2; P.push(new THREE.Vector2(R-c+c*Math.cos(t), -HW+c+c*Math.sin(t)));}
  for(let i=0;i<=10;i++){const t=i/10*Math.PI/2; P.push(new THREE.Vector2(R-c+c*Math.cos(t), HW-c+c*Math.sin(t)));}
  P.push(new THREE.Vector2(232,50));
  const tyre=new THREE.Mesh(new THREE.LatheGeometry(P,120),new THREE.MeshStandardMaterial({color:0x1b1b1b,roughness:.9}));
  tyre.castShadow=true; wheel.add(tyre);
  const knobM=new THREE.MeshStandardMaterial({color:0x151515,roughness:.95});
  for(let i=0;i<64;i++){const t=i/64*Math.PI*2; for(const y of (i%2?[-30,30]:[0,-48,48])){const k=new THREE.Mesh(new THREE.BoxGeometry(16,8,20),knobM); k.position.set((R+3)*Math.cos(t),y,(R+3)*Math.sin(t)); k.rotation.y=-t; wheel.add(k);} }
  // tyre lathe axis is Y already (LatheGeometry revolves around Y)
  const rim=new THREE.Mesh(new THREE.TorusGeometry(228,9,12,96),new THREE.MeshStandardMaterial({color:0xd4af37,metalness:.8,roughness:.3})); rim.rotation.x=Math.PI/2; wheel.add(rim);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(55,55,110,40),new THREE.MeshStandardMaterial({color:0xaaaaaa,metalness:.7,roughness:.35})); wheel.add(hub);
  const spM=new THREE.MeshStandardMaterial({color:0xcccccc,metalness:.9,roughness:.25});
  for(let i=0;i<36;i++){const t=i/36*Math.PI*2, yy=(i%2?1:-1)*45; const s=new THREE.Vector3(50*Math.cos(t),yy,50*Math.sin(t)), e=new THREE.Vector3(222*Math.cos(t+0.35),(i%2?1:-1)*8,222*Math.sin(t+0.35)); const L=s.distanceTo(e); const sp=new THREE.Mesh(new THREE.CylinderGeometry(2,2,L,6),spM); sp.position.copy(s.clone().add(e).multiplyScalar(.5)); sp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),e.clone().sub(s).normalize()); wheel.add(sp);}
  // swingarm legs (simple alloy boxes)
  const am=new THREE.MeshStandardMaterial({color:0xb8bcc2,metalness:.75,roughness:.35});
  for(const y of [-70,70]){const L=580; const b=new THREE.Mesh(new THREE.BoxGeometry(L,22,55),am); b.position.set(ax[0]/2,y,ax[2]/2); b.rotation.y=a; b.castShadow=true; sc.add(b);}
  // ground
  const gr=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),new THREE.ShadowMaterial({opacity:.25})); gr.position.z=ax[2]-R-6; gr.receiveShadow=true; sc.add(gr);
  r.render(sc,cam); return r.domElement.toDataURL('image/png');
};
</script></body></html>
