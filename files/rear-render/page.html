function front(opt){
  const ang=27.0*Math.PI/180;               // head tube axis in the scan frame, from the scan (front edge 455/575 to 518/450)
  const u=[Math.sin(ang),-Math.cos(ang)], f=[Math.cos(ang),Math.sin(ang)];

  const topYokeZ=15, botYokeZ=-(HEAD+10+36);   // local Z up the axis from the head tube top
  const tubeTopZ=topYokeZ+20+slide, len=fork-sag, axleZ=tubeTopZ-len, sliderTopZ=axleZ+360;
