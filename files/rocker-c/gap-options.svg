<text x="50" y="876" font-size="15" font-weight="400" fill="#333" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4">Test: arm at full droop, swing the shock bottom eye forward to each spot. The furthest forward spot that still clears is the one to build.</text>
<text x="50" y="902" font-size="15" font-weight="400" fill="#333" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4">Spring rates scale from ~105 N/mm for G (Joel 110 kg in kit, bike 115 kg). The XR shock will want a revalve for the stiffer springs.</text>
