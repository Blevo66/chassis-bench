<text x="830.0" y="940.0" font-size="14" text-anchor="start" font-weight="400" fill="#444">Print 58 / 60 / 62 test bones if you can: the lug was taped, not</text>
<text x="830.0" y="960.0" font-size="14" text-anchor="start" font-weight="400" fill="#444">measured off a drawing, so the length may want a nudge.</text>
<text x="30.0" y="875.0" font-size="18" text-anchor="start" font-weight="700" fill="#111">What it should do</text>
<text x="40.0" y="903.0" font-size="15" text-anchor="start" font-weight="400" fill="#111">• 254 mm wheel travel on the 95 mm stroke</text>
<text x="40.0" y="927.0" font-size="15" text-anchor="start" font-weight="400" fill="#111">• Ratio 2.79 at top-out falling to 2.32 at full bump (about 20% rising rate)</text>
<text x="40.0" y="951.0" font-size="15" text-anchor="start" font-weight="400" fill="#111">• Dogbone never closer than 40° to the rocker, so no lock-out</text>
<text x="40.0" y="975.0" font-size="15" text-anchor="start" font-weight="400" fill="#111">• Shock eye about 30 mm clear of the arm cross-member at full droop</text>
<text x="40.0" y="999.0" font-size="15" text-anchor="start" font-weight="400" fill="#111">• Assumes the arm lug is 180 back / 100 down with the arm at 20°</text>
