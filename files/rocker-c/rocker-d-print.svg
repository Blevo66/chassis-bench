<text x="170.0" y="880.0" font-size="14" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">rocker end 10.8</text>
<text x="363.2" y="880.0" font-size="14" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">lug end 12.8 (M12)</text>
<text x="60.0" y="950.0" font-size="14" text-anchor="start" font-weight="400" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">Print test bones at 83 / 85 / 87.</text>
<text x="560.0" y="760.0" font-size="16" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">What it should do</text>
<text x="560.0" y="786.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• 223 mm wheel travel, ratio 2.56 falling to 2.14 (about 19% rising rate)</text>
<text x="560.0" y="810.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Dogbone never closer than 41° to the rocker: no lock-out</text>
<text x="560.0" y="834.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Later: same rocker with a 380 / 120 custom shock gives about 275 mm at 25%</text>
<text x="560.0" y="858.0" font-size="16" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">Check on the bike</text>
<text x="560.0" y="884.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• The notch and dip are cut from my CRF250 arm model and a guessed</text>
<text x="560.0" y="908.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">  shock clevis, with only 3 mm gaps. Narrowest neck is about 13 mm.</text>
