<text x="60.0" y="760.0" font-size="15" text-anchor="start" font-weight="400" fill="#444">Suggested plate: bosses ⌀34 (pivot) and ⌀28, arms 22 wide.</text>
<text x="60.0" y="782.0" font-size="15" text-anchor="start" font-weight="400" fill="#444">Keep it a V: no third side between the shock and dogbone eyes,</text>
<text x="60.0" y="804.0" font-size="15" text-anchor="start" font-weight="400" fill="#444">because the swingarm cross-member sweeps through that gap.</text>
<text x="60.0" y="826.0" font-size="15" text-anchor="start" font-weight="400" fill="#444">Shock end must fit the XR clevis (~16 gap, ~30 clear above the bolt).</text>
<text x="830.0" y="110.0" font-size="18" text-anchor="start" font-weight="700" fill="#111">Where it sits at full droop (from the swingarm pivot)</text>
