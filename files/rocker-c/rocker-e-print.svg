<text x="60.0" y="950.0" font-size="14" text-anchor="start" font-weight="400" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">Print test bones at 93 / 95 / 97.</text>
<text x="560.0" y="760.0" font-size="16" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">What it should do</text>
<text x="560.0" y="786.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• 206 mm wheel travel, ratio 2.36 falling to 1.99 (about 19% rising rate)</text>
<text x="560.0" y="810.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Dogbone never closer than 42° to the rocker: no lock-out</text>
<text x="560.0" y="834.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Later: same rocker with a 380 / 120 custom shock gives about 255 mm at 24%</text>
<text x="560.0" y="858.0" font-size="16" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">Check on the bike</text>
<text x="560.0" y="884.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• The notch and dip are cut from my CRF250 arm model and a guessed</text>
<text x="560.0" y="908.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">  clevis (bridge 25 mm from the bolt), with 5 mm gaps. Narrowest neck about 23 mm.</text>
<text x="560.0" y="932.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Assumes the lug is 180 back / 100 down with the arm at 20°.</text>
<text x="560.0" y="956.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Plate: 16 mm thick to fit the XR clevis gap (check yours).</text>
