<text x="560.0" y="880.0" font-size="16" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">What it should do</text>
<text x="560.0" y="906.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• About 289 mm wheel travel with the XR shock, ratio 3.5 falling to 3.2 (11% rising rate)</text>
<text x="560.0" y="930.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Spring about 250 N/mm (~25 kg/mm, top end of what is made) plus a revalve</text>
<text x="560.0" y="954.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Dogbone eye sits ~27 mm in front of the XL mount: curve the plate round the frame as needed</text>
<text x="560.0" y="978.0" font-size="16" text-anchor="start" font-weight="700" fill="#111" paint-order="stroke" stroke="white" stroke-width="4">Check on the bike (arm model is only good to about ±10 mm)</text>
<text x="560.0" y="1004.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Shock eye in the hole: ~15 mm from the brace front face at full droop</text>
<text x="560.0" y="1028.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Dogbone passes close under the lug block front face at full droop</text>
<text x="560.0" y="1052.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Dogbone offset: shift its eye 10 mm left in the lug gap with spacers</text>
<text x="560.0" y="1076.0" font-size="14" text-anchor="start" font-weight="400" fill="#333" paint-order="stroke" stroke="white" stroke-width="4">• Plate 16 mm (XR clevis gap)</text>
