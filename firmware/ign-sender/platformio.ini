; XL125R ignition-battery sender: ESP32-C3 SuperMini on the ignition Li-ion pack.
; Measures pack voltage, broadcasts it over Bluetooth LE, sleeps. No wire to the body loom.
; Build:  pio run        Flash over USB-C:  pio run -t upload
[env:ign-sender]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
