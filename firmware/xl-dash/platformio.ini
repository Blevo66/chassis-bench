; XL125R body-loom box + dash: ESP32 8-channel MOS board, 4" ST7796S TFT (LCDwiki MSP4020), u-blox M10 GPS.
; Build:  pio run        Flash over USB-C:  pio run -t upload
[env:xl-dash]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    mikalhart/TinyGPSPlus@1.0.3
    h2zero/NimBLE-Arduino@1.4.2
build_flags =
    ; ---- TFT_eSPI setup (pins must match config.h) ----
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_SCLK=18
    -D TFT_MOSI=23
    -D TFT_MISO=-1
    -D TFT_CS=5
    -D TFT_DC=4
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000
