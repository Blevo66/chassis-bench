; XL125R body-loom box + dash on the Waveshare ESP32-S3-Touch-LCD-3.5
; (ESP32-S3R8, 3.5" 480x320 ST7796 IPS on SPI, FT6336 touch, AXP2101 + LiPo, TCA9554 expander)
; plus the Fowecry 8-ch opto MOSFET board (3.3 V) and a UART GPS.
; Build:  pio run        Flash over USB-C:  pio run -t upload
; Pins for the screen come from Waveshare's own BSP and Arduino examples.
[env:xl-dash]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB   ; Waveshare: 16 MB flash, 8 MB OPI PSRAM
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    mikalhart/TinyGPSPlus@1.0.3
    h2zero/NimBLE-Arduino@1.4.2
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ---- TFT_eSPI setup (Waveshare 3.5: no CS, reset is on the TCA9554 expander) ----
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_SCLK=5
    -D TFT_MOSI=1
    -D TFT_MISO=2
    -D TFT_CS=-1
    -D TFT_DC=3
    -D TFT_RST=-1
    -D TFT_INVERSION_ON=1   ; IPS panel (Waveshare's example sets IPS=true). If colours look negative, remove this line
    -D USE_HSPI_PORT=1      ; avoids a known TFT_eSPI crash on the S3's default SPI port
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000   ; try 80000000 for smoother updates once it works
